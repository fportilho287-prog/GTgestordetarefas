<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Chat | Login</title>

    <!-- Estilos 
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/cabecalho.css">-->
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body class="dark">
    <main class="container">

        <!-- Coluna esquerda (imagem de fundo / destaque) -->
        <section class="banner">
            <img src="IMG/img_login.jpg" alt="Imagem ilustrativa do sistema">
        </section>

        <!-- Coluna direita (login) -->
        <section class="login">

            <!-- Logo -->
            <div class="login-logo">
                <img src="IMG/img_logo_dark.png" alt="Logo Bia Chat">
            </div>

            <!-- Título -->
            <header class="login-header">
                <h1>Bem-vindo de volta!</h1>
                <p>Por favor, faça login na sua conta</p>
            </header>

            <!-- Formulário -->
            <form action="gerenciador.html" method="GET" class="login-form">

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember">
                        Lembrar-me
                    </label>

                    <a href="#" class="forgot-password">
                        Esqueceu sua senha?
                    </a>
                </div>

                    <button type="submit" class="btn-login">
                        Iniciar Sessão
                    </button>
                    <p class="register">
                        Não tem uma conta?
                        <a href="#">Inscreva-se</a>
                    </p>
                

            </form>
        </section>

    </main>
</body>
</html>
